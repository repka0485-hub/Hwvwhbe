name: build-esp

on:
  push:
  workflow_dispatch:
    inputs:
      androidimgui_ref:
        description: "AndroidImgui tag/branch"
        default: "v2.0"

env:
  ANDROIDIMGUI_REF: ${{ github.event.inputs.androidimgui_ref || 'v2.0' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Normalize layout (tolerates flat / partial upload)
        run: |
          if [ -f esp-project.zip ]; then
            echo "esp-project.zip found in repo, extracting missing files from it"
            rm -rf /tmp/z && mkdir -p /tmp/z && unzip -q -o esp-project.zip -d /tmp/z
            ZROOT=$(dirname "$(find /tmp/z -name CMakeLists.txt | head -1)")
            echo "zip root: $ZROOT"
            cp -rn "$ZROOT"/* . || true
          fi
          mkdir -p src tools
          for f in main.cpp esp.h il2.h mem.h offsets.h; do
            if [ ! -f "src/$f" ] && [ -f "$f" ]; then mv "$f" "src/$f"; fi
          done
          for f in gen_offsets.py find_headers.sh; do
            if [ ! -f "tools/$f" ] && [ -f "$f" ]; then mv "$f" "tools/$f"; fi
          done
          if [ ! -f src/offsets.h ]; then
            echo "src/offsets.h missing, writing built-in copy"
            cat > src/offsets.h << 'OFFEOF'
          // GENERATED by tools/gen_offsets.py from dump.cs. Do not edit.
          // Regenerate whenever the game build changes. RVAs are relative to libil2cpp.so load base.
          #pragma once
          #include <cstdint>
          namespace off {
          namespace PlayerNetwork {
            constexpr uint32_t _mainCamera = 0x28;
            constexpr uint32_t networkPosition = 0xbc;
            constexpr uint32_t networkRotation = 0xc8;
            constexpr uint32_t _remoteCameraPivot = 0x110;
            constexpr uint32_t _hasReceivedFirstSnapshot = 0xe0;
          }
          namespace PlayerController {
            constexpr uint32_t _isDeath = 0xa8;
            constexpr uint32_t _player = 0x90;
            constexpr uint32_t _network = 0x88;
            constexpr uint32_t _view = 0x80;
            constexpr uint32_t _mainCameraHolder = 0x38;
            constexpr uint32_t STATIC__actorToView = 0x0;  // offset inside static_fields
            constexpr uint64_t RVA_GetView = 0x276c4dc;
          }
          namespace PhotonView {
            constexpr uint32_t ObservedComponents = 0x50;
            constexpr uint32_t _IsMine_k__BackingField = 0x60;
            constexpr uint32_t _Owner_k__BackingField = 0x78;
            constexpr uint32_t ownerActorNr = 0x80;
          }
          namespace Player {
            constexpr uint32_t actorNumber = 0x18;
            constexpr uint32_t IsLocal = 0x1c;
            constexpr uint32_t nickName = 0x20;
          }
          }
          OFFEOF
          fi
          missing=0
          for f in CMakeLists.txt start.sh src/main.cpp src/esp.h src/il2.h src/mem.h src/offsets.h tools/gen_offsets.py tools/find_headers.sh; do
            [ -f "$f" ] || { echo "MISSING: $f"; missing=1; }
          done
          if [ "$missing" != 0 ]; then
            echo "--- repo tree ---"; find . -path ./.git -prune -o -type f -print
            exit 1
          fi

      - name: Fetch AndroidImgui (includes Dear ImGui + freetype submodules)
        run: |
          git clone --recursive --shallow-submodules --depth 1 --branch "$ANDROIDIMGUI_REF" \
            https://github.com/enenH/AndroidImgui third_party/AndroidImgui
          git -C third_party/AndroidImgui rev-parse HEAD
          git -C third_party/AndroidImgui submodule status

      - name: Regenerate offsets from dump/dump.cs (if present)
        run: |
          if [ -f dump/dump.cs ]; then
            python3 tools/gen_offsets.py dump/dump.cs > src/offsets.h
            echo "offsets regenerated"
          else
            echo "dump/dump.cs not in repo, using committed src/offsets.h"
          fi
          cat src/offsets.h

      - name: Discover AndroidImgui headers
        run: |
          mkdir -p build/gen
          sh tools/find_headers.sh third_party/AndroidImgui build/gen/ai_includes.h

      - name: Configure (NDK, arm64-v8a)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK=$NDK"
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DCMAKE_ANDROID_NDK="$NDK" -DANDROID_NDK="$NDK" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEN_INCLUDE_DIR="$PWD/build/gen"

      - name: Build
        run: cmake --build build --target esp -j"$(nproc)"

      - name: Package
        run: |
          mkdir -p dist
          cp build/esp dist/esp
          cp start.sh dist/start.sh
          file dist/esp
          (cd dist && sha256sum esp start.sh > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: esp-arm64
          path: dist/*
